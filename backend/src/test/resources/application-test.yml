spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never contacted: tests inject validated JWTs directly. Set so the decoder bean can be built.
          issuer-uri: http://localhost:65535/realms/test
  data:
    redis:
      url: redis://localhost:65535

management:
  health:
    redis:
      enabled: false

lms:
  storage:
    # Small thresholds so the multipart path runs with a few MB instead of 100+ MB.
    single-part-max-bytes: 6291456   # 6 MiB
    part-size-bytes: 5242880         # 5 MiB (S3's minimum part size)
  media:
    fake-transcode-delay: 100ms
