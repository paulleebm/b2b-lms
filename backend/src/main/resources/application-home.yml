# Profile "home": the self-hosted deployment (infra/home). SPRING_PROFILES_ACTIVE=home.
#
# Tokens carry the public issuer (https://auth.bymile.site/realms/lms), but the signing keys are
# fetched over the Docker network from the Keycloak container instead of going out through
# Cloudflare and back in. The issuer is still checked against issuer-uri.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI}

springdoc:
  api-docs:
    enabled: false   # the API is behind Cloudflare Access; no public schema browsing
  swagger-ui:
    enabled: false
