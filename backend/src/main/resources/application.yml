server:
  port: 8081

spring:
  application:
    name: lms-api
  threads:
    virtual:
      enabled: true          # I/O-bound server: wait on DB/HTTP without tying up platform threads
  mvc:
    problemdetails:
      enabled: true          # RFC 9457 error bodies for framework errors too
  jpa:
    open-in-view: false      # no lazy loading during response rendering -> queries stay inside the service layer
    hibernate:
      ddl-auto: validate     # Flyway owns the schema; Hibernate only checks entities match it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    # The app connects as lms_app: not the table owner, no BYPASSRLS -> Postgres RLS applies.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms}
    username: ${DB_APP_USER:lms_app}
    password: ${DB_APP_PASSWORD:lms_app_dev}
  flyway:
    # Migrations run as the owner. In AWS this is a separate one-off ECS task, so it is off there.
    enabled: ${FLYWAY_ENABLED:true}
    user: ${DB_OWNER_USER:lms_owner}
    password: ${DB_OWNER_PASSWORD:lms_owner_dev}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false               # Flyway owns event_publication (V6)
      republish-outstanding-events-on-restart: true
  mail:
    # Local: Mailpit (http://localhost:8025). AWS: the SES SMTP endpoint with STARTTLS.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 60s                # dashboard numbers may be up to a minute old
      key-prefix: "lms:cache:"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/lms}
          audiences: lms-api

lms:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:lms}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:lms-admin}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:lms-admin-dev-secret}
    web-client-id: ${KEYCLOAK_WEB_CLIENT_ID:lms-web}
    app-url: ${APP_URL:http://localhost:3000}
  storage:
    bucket: ${S3_BUCKET:lms-media-local}
    region: ${AWS_REGION:ap-northeast-2}
    # Empty in AWS (the SDK resolves the regional endpoint and the ECS task role).
    # Locally: S3Mock, with path-style URLs and dummy credentials.
    endpoint: ${S3_ENDPOINT:http://localhost:9090}
    single-part-max-bytes: 104857600      # <= 100 MiB: one presigned PUT; above: multipart
    part-size-bytes: 16777216             # 16 MiB parts (S3 minimum is 5 MiB, max 10,000 parts)
    upload-url-ttl: 15m
    download-url-ttl: 5m
  messaging:
    endpoint: ${SQS_ENDPOINT:http://localhost:9324}   # empty in AWS; ElasticMQ locally
    region: ${AWS_REGION:ap-northeast-2}
    queues:
      events: ${SQS_EVENTS_QUEUE:lms-events}
      transcode: ${SQS_TRANSCODE_QUEUE:lms-transcode}
    worker-enabled: ${WORKER_ENABLED:true}           # AWS: false on the api service, true on the worker
    poll-wait: 10s
    max-messages: 10
  mail:
    from: ${MAIL_FROM:LMS <no-reply@lms.local>}
  media:
    transcoder: ${VIDEO_TRANSCODER:fake}  # fake (local) | mediaconvert (AWS, see docs/05)
    fake-transcode-delay: 3s

management:
  endpoints:
    web:
      exposure:
        include: health      # only health is exposed; everything else stays internal
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}] [tenant=%X{tenantId:-}]"
