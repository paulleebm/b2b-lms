<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{mail/layout :: mail(title=${overdue} ? '교육 마감일이 지났습니다' : '교육 마감일이 다가옵니다', content=~{::content})}">
<body>
<div th:fragment="content">
  <p><span th:text="${name}">이름</span>님, <strong th:text="${courseTitle}">코스</strong> 교육을 아직 마치지 않았습니다.</p>
  <p th:if="${due != ''}">마감일: <strong th:text="${due}">11월 20일</strong></p>
  <p><a th:href="${appUrl + path}" style="display:inline-block;padding:10px 18px;background:#1D2738;color:#ffffff;border-radius:6px;text-decoration:none;">이어서 학습하기</a></p>
</div>
</body>
</html>
