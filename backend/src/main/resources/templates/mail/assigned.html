<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{mail/layout :: mail(title='새 필수 교육이 배정되었습니다', content=~{::content})}">
<body>
<div th:fragment="content">
  <p><span th:text="${name}">이름</span>님, <strong th:text="${courseTitle}">코스</strong> 교육이 배정되었습니다.</p>
  <p th:if="${due != ''}">마감일은 <strong th:text="${due}">11월 20일</strong>입니다.</p>
  <p><a th:href="${appUrl + '/app'}" style="display:inline-block;padding:10px 18px;background:#1D2738;color:#ffffff;border-radius:6px;text-decoration:none;">내 교육 열기</a></p>
</div>
</body>
</html>
