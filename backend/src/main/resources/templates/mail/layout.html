<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body th:fragment="mail(title, content)" style="margin:0;padding:24px;background:#F7F7F4;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1D2738;">
<table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #D9DBDE;border-radius:8px;">
  <tr><td style="padding:28px 28px 8px;font-size:13px;color:#4A5261;letter-spacing:0.08em;">LMS</td></tr>
  <tr><td style="padding:0 28px;font-size:20px;font-weight:700;line-height:1.4;word-break:keep-all;" th:text="${title}">제목</td></tr>
  <tr><td style="padding:16px 28px 28px;font-size:15px;line-height:1.75;word-break:keep-all;" th:insert="${content}">본문</td></tr>
</table>
<p style="max-width:560px;margin:16px auto 0;font-size:12px;color:#6B7280;line-height:1.6;">회사에서 배정한 교육 안내 메일입니다. 이 메일에 회신하지 마세요.</p>
</body>
</html>
