<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>수료증</title>
  <style>
    /* A4 landscape. Tokens from DESIGN.md: paper, ink, seal (completion only). */
    @page { size: 297mm 210mm; margin: 0; }
    body { margin: 0; font-family: 'Pretendard'; color: #1D2738; background: #F7F7F4; }
    .sheet { position: relative; width: 297mm; height: 210mm; box-sizing: border-box; padding: 22mm 26mm; }
    .frame { position: absolute; top: 10mm; left: 10mm; right: 10mm; bottom: 10mm; border: 0.6mm solid #1D2738; }
    .frame-inner { position: absolute; top: 12.5mm; left: 12.5mm; right: 12.5mm; bottom: 12.5mm; border: 0.25mm solid #7F848E; }
    .company { font-size: 11pt; letter-spacing: 0.3em; color: #4A5261; }
    h1 { margin: 14mm 0 0 0; font-size: 40pt; font-weight: 700; letter-spacing: 0.5em; }
    .holder { margin-top: 16mm; font-size: 24pt; font-weight: 700; }
    .holder small { font-size: 12pt; font-weight: 400; color: #4A5261; margin-left: 3mm; }
    .body { margin-top: 8mm; font-size: 13pt; line-height: 1.8; width: 175mm; }
    .course { font-weight: 700; }
    .meta { position: absolute; left: 26mm; bottom: 24mm; font-size: 10pt; color: #4A5261; line-height: 1.7; }
    .seal { position: absolute; right: 30mm; bottom: 26mm; width: 34mm; height: 34mm; border: 1.2mm solid #BF4A17;
            border-radius: 2mm; color: #BF4A17; text-align: center; transform: rotate(-6deg); }
    .seal span { display: block; font-size: 20pt; font-weight: 700; line-height: 1.15; padding-top: 4.5mm; }
  </style>
</head>
<body>
<div class="sheet">
  <div class="frame"></div>
  <div class="frame-inner"></div>
  <div class="company" th:text="${c.companyName}">에이크미</div>
  <h1>수 료 증</h1>
  <div class="holder"><span th:text="${c.holderName}">홍길동</span><small>님</small></div>
  <div class="body">
    위 사람은 <span class="course" th:text="${c.courseTitle}">코스</span> 과정을 모두 마치고
    평가를 통과하였으므로 이 증서를 드립니다.
  </div>
  <div class="meta">
    <div>수료일 <span th:text="${c.issuedDate}">2026년 11월 6일</span></div>
    <div>수료번호 <span th:text="${c.serial}">LMS-2026-XXXXXXXX</span></div>
    <div>진위 확인 <span th:text="${c.verifyUrl}">https://app.example.com/verify/…</span></div>
  </div>
  <div class="seal"><span>수<br/>료</span></div>
</div>
</body>
</html>
