# ElasticMQ: an SQS-compatible server for local development and tests (Amazon's SQS API, so the
# same AWS SDK code runs against it). Chosen over LocalStack (needs an auth token since 2026.03).
# Queues mirror infra/terraform/modules/async: a message received 5 times moves to the DLQ.
include classpath("application.conf")

queues {
  lms-events-dlq {}
  lms-events {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "lms-events-dlq"
      maxReceiveCount = 5
    }
  }
  lms-transcode-dlq {}
  lms-transcode {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "lms-transcode-dlq"
      maxReceiveCount = 5
    }
  }
}
