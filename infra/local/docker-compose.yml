# Local development stack.
#   docker compose -f infra/local/docker-compose.yml up -d
#
# Ports:  postgres 5432 · valkey 6379 · keycloak 8080 · mailpit 8025 (UI) / 1025 (SMTP) · s3mock 9090 · elasticmq 9324 (SQS) / 9325 (UI)
# The Spring API (8081) and Next.js (3000) run on the host with hot reload.
# Credentials here are dev-only. Production values live in AWS SSM Parameter Store.

name: lms

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  # S3-compatible stand-in for AWS S3. Chosen over LocalStack (needs an auth token since 2026.03)
  # and MinIO (community edition discontinued). It does not verify presigned-URL signatures, so
  # signature/expiry behaviour is only proven against real S3.
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: lms-media-local
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3data:/s3mockroot

  # SQS-compatible queues (outbox relay → worker). Same AWS SDK code as in AWS.
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
